name: Publish Content

# Write side of the headless-CMS content pipeline used by api.arthurplazanet.com's
# GitHubActionsContentService. Triggered via Octokit's actions.createWorkflowDispatch
# (workflow_dispatch is fire-and-forget — no run id comes back to the caller, so the
# API can't confirm success synchronously; it treats this as the durable/public mirror,
# not the live read path). Reads for these content types still go straight to the repo
# contents API — only writes for blog/snippets go through this workflow instead of a
# direct commit.
#
# Validation and the actual file write live in scripts/publish-content.mjs: inputs are
# untrusted (ultimately back-office user input), and passing them as plain env vars into
# a Node script sidesteps the shell-quoting/injection surface that interpolating
# `${{ inputs.* }}` directly into a run: body would open up.

on:
  workflow_dispatch:
    inputs:
      contentType:
        description: 'Content directory under database/public/ (blog | snippets)'
        required: true
      action:
        description: 'create | update | delete'
        required: true
      slug:
        description: 'Entry slug — becomes the filename'
        required: true
      payload:
        description: 'JSON string of the entry (omitted for delete)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CONTENT_TYPE: ${{ inputs.contentType }}
      ACTION: ${{ inputs.action }}
      SLUG: ${{ inputs.slug }}
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply change
        run: node scripts/publish-content.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "database/public/$CONTENT_TYPE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "$ACTION: $CONTENT_TYPE/$SLUG"
          git push origin "HEAD:${{ github.ref_name }}"
